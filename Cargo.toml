[package]
name = "utopia-cdn"
description = "CDN cache purges (Cloudflare, Fastly, and a fan-out over several) and certificate providers (Cloudflare custom hostnames, Fastly domains and TLS subscriptions, and a proxy routing between them)."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
repository = "https://github.com/utopia-rs/cdn"

[dependencies]
php-std = { version = "0.1.0", git = "https://github.com/utopia-rs/php-std" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
utopia-balancer = { version = "0.1.0", git = "https://github.com/utopia-rs/balancer" }
utopia-client = { version = "0.1.0", git = "https://github.com/utopia-rs/client" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }

[package.metadata.utopia]
php-sync = "809d2819d7da00d8b2f486e3bcb4c98a5265e950"